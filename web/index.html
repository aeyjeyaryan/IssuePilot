<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IssuePilot</title>
<style>
  :root { --bg:#0d1117; --fg:#c9d1d9; --accent:#58a6ff; --ok:#3fb950; --err:#f85149; --muted:#8b949e; --panel:#161b22; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid #30363d; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header .tag { color:var(--muted); font-size:12px; }
  main { max-width:1100px; margin:0 auto; padding:24px; display:grid; gap:16px; }
  .panel { background:var(--panel); border:1px solid #30363d; border-radius:8px; padding:16px; }
  .panel h2 { font-size:14px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  input[type=text] { width:100%; padding:10px; background:var(--bg); border:1px solid #30363d; border-radius:6px; color:var(--fg); font-size:14px; }
  button { padding:10px 18px; background:var(--accent); color:#fff; border:0; border-radius:6px; font-size:14px; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.secondary { background:#30363d; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  label.toggle { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer; }
  #steps { display:flex; flex-wrap:wrap; gap:8px; }
  .step { padding:6px 12px; border-radius:999px; font-size:12px; border:1px solid #30363d; color:var(--muted); }
  .step.running { border-color:var(--accent); color:var(--accent); }
  .step.completed { border-color:var(--ok); color:var(--ok); background:rgba(63,185,80,.08); }
  .step.failed { border-color:var(--err); color:var(--err); }
  #logs { max-height:340px; overflow-y:auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; line-height:1.6; }
  .log { padding:3px 0; border-bottom:1px solid #21262d; white-space:pre-wrap; word-break:break-word; }
  .log .t { color:var(--muted); margin-right:8px; }
  pre { background:var(--bg); border:1px solid #30363d; border-radius:6px; padding:12px; overflow-x:auto; font-size:12px; }
  .banner { padding:10px 12px; border-radius:6px; font-size:13px; margin-top:12px; }
  .banner.ok { background:rgba(63,185,80,.12); border:1px solid var(--ok); color:var(--ok); }
  .banner.err { background:rgba(248,81,73,.12); border:1px solid var(--err); color:var(--err); }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>IssuePilot</h1>
  <span class="tag">issue &rarr; test &rarr; fix &rarr; PR</span>
</header>
<main>
  <section class="panel">
    <h2>Issue</h2>
    <input type="text" id="issueUrl" placeholder="https://github.com/owner/repo/issues/123">
    <div class="row">
      <button id="runBtn">Run agent</button>
      <button id="demoBtn" class="secondary">Run demo (offline)</button>
      <label class="toggle"><input type="checkbox" id="dryRun" checked> Dry run (no PR)</label>
    </div>
    <div id="banner" class="banner hidden"></div>
  </section>

  <section class="panel">
    <h2>Steps</h2>
    <div id="steps"></div>
  </section>

  <section class="panel">
    <h2>Agent log</h2>
    <div id="logs"></div>
  </section>

  <section class="panel" id="diffPanel">
    <h2>Patch / Diff</h2>
    <pre id="diff">No patch yet.</pre>
  </section>
</main>
<script>
const STEPS = ["fetch_issue","clone_repo","index_codebase","write_failing_test","draft_fix","apply_patch","run_in_sandbox","open_pr"];
const stepsEl = document.getElementById('steps');
const logsEl = document.getElementById('logs');
STEPS.forEach(s => {
  const d = document.createElement('div');
  d.className = 'step'; d.id = 'step-' + s; d.textContent = s;
  stepsEl.appendChild(d);
});
function log(msg) {
  const t = new Date().toLocaleTimeString();
  const d = document.createElement('div');
  d.className = 'log';
  d.innerHTML = '<span class="t">' + t + '</span>' + escapeHtml(msg);
  logsEl.appendChild(d);
  logsEl.scrollTop = logsEl.scrollHeight;
}
function escapeHtml(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function setStep(name, status) {
  const el = document.getElementById('step-' + name);
  if (el) el.className = 'step ' + status;
}
function banner(text, ok) {
  const b = document.getElementById('banner');
  b.className = 'banner ' + (ok ? 'ok' : 'err');
  b.textContent = text;
  b.classList.remove('hidden');
}
document.getElementById('runBtn').onclick = () => start(false);
document.getElementById('demoBtn').onclick = () => start(true);
async function start(demo) {
  document.getElementById('runBtn').disabled = true;
  document.getElementById('demoBtn').disabled = true;
  logsEl.innerHTML = '';
  STEPS.forEach(s => setStep(s, ''));
  const dry = document.getElementById('dryRun').checked;
  const url = document.getElementById('issueUrl').value || 'demo://local/1';
  let res;
  try {
    res = await fetch('/run', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({issue_url:url, dry_run:dry, demo_mode:demo})});
  } catch (e) { banner('Backend unreachable: ' + e.message, false); return; }
  const {run_id} = await res.json();
  const es = new EventSource('/stream/' + run_id + '?dry_run=' + dry + '&demo_mode=' + demo);
  es.addEventListener('step', e => {
    const d = JSON.parse(e.data);
    setStep(d.step, d.status);
    if (d.status === 'running') log('▶ ' + d.step);
  });
  es.addEventListener('log', e => log(JSON.parse(e.data).message));
  es.addEventListener('complete', e => {
    const d = JSON.parse(e.data);
    banner(d.status === 'success' ? 'Completed successfully.' : 'Completed with failures.', d.status === 'success');
    if (d.patch) document.getElementById('diff').textContent = d.patch;
    es.close();
    document.getElementById('runBtn').disabled = false;
    document.getElementById('demoBtn').disabled = false;
  });
  es.addEventListener('error', e => {
    banner('Stream error', false);
    es.close();
    document.getElementById('runBtn').disabled = false;
    document.getElementById('demoBtn').disabled = false;
  });
}
</script>
</body>
</html>
